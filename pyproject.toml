[project]
name = "iphone-alarms-sync"
version = "0.1.0"
description = "Home Assistant custom integration for iPhone and iPad alarms sync"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    # Pins the Home Assistant version the tests run against.
    "pytest-homeassistant-custom-component==0.13.375",
    "ruff",
    "segno==1.6.1",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
