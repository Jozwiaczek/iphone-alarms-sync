[project]
name = "iphone-alarms-sync"
version = "0.1.0"
description = "Home Assistant custom integration for iPhone and iPad alarms sync"
requires-python = ">=3.14.2"
dependencies = []

[dependency-groups]
dev = [
    "mypy",
    "pytest-cov",
    # Pins the Home Assistant version the tests run against.
    "pytest-homeassistant==2026.11.2",
    "ruff",
    "segno==1.6.6",
]

[tool.ruff]
line-length = 88
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = []

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
# Let Home Assistant install its httpx alias before respx is imported.
addopts = "-p no:respx"
testpaths = ["tests"]
