name: Feature request
description: Suggest an improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What do you want to do?
      description: Describe the automation or situation, not only the solution.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Proposed solution
      description: Optional. How could it work? New entities, attributes, triggers or shortcut changes. An example in YAML helps.
  - type: checkboxes
    id: pull_request
    attributes:
      label: Contribution
      options:
        - label: I would like to open a pull request for this.
  - type: markdown
    attributes:
      value: |
        iOS limits what a shortcut can read: Home Assistant only learns about alarms when a shortcut runs (see [Limitations](https://github.com/Jozwiaczek/iphone-alarms-sync#limitations)).
