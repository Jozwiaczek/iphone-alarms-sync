name: Validate

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  # The Release workflow runs these checks before it publishes anything.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run hassfest
        uses: home-assistant/actions/hassfest@master

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Run checks
        run: |
          python -m pip install uv
          uv run --locked scripts/check.sh

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration
