name: Release

# Push to main -> beta prerelease (vX.Y.Z-beta.N), tested before it reaches users.
# Manual run -> stable release with all changes since the last stable one:
#   gh workflow run release.yml -R Jozwiaczek/iphone-alarms-sync --ref main
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      HUSKY: 0
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MANIFEST: custom_components/iphone_alarms_sync/manifest.json
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Beta release
        if: github.event_name == 'push'
        run: |
          npx semantic-release --dry-run
          [ -f .next-version ] || exit 0 # no releasable commits
          VERSION="$(cat .next-version)-beta.${{ github.run_number }}"
          jq --arg v "$VERSION" '.version = $v' "$MANIFEST" > tmp.json && mv tmp.json "$MANIFEST"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The tagged commit stays off main, so betas add no bot commits there.
          git commit -m ":bookmark: v$VERSION" -- "$MANIFEST"
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --prerelease --generate-notes --title "v$VERSION"

      - name: Stable release
        if: github.event_name == 'workflow_dispatch'
        run: |
          npx semantic-release
          gh release list --limit 200 --json tagName,isPrerelease --jq '.[] | select(.isPrerelease) | .tagName' \
            | xargs -r -n1 gh release delete --yes --cleanup-tag
